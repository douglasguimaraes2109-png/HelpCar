<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Manutenção Automotiva</title>
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca para geração do PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container" id="conteudoParaPdf">
    <h2>Checklist de Manutenção</h2>
    <div class="subtitle">Selecione o veículo pela API da FIPE e confira as revisões</div>

    <div class="form-group no-print">
        <label for="marca">1. Selecione a Marca</label>
        <select id="marca">
            <option value="">Carregando marcas...</option>
        </select>
    </div>

    <div class="form-group no-print">
        <label for="modelo">2. Selecione o Modelo</label>
        <select id="modelo" disabled>
            <option value="">Selecione uma marca primeiro</option>
        </select>
    </div>

    <div class="form-group no-print">
        <label for="km">3. Quilometragem Atual (km)</label>
        <input type="number" id="km" placeholder="Ex: 80000" value="80000">
    </div>

    <button id="btnBuscar" class="no-print">Buscar Manutenções Necessárias</button>

    <div class="checklist-section">
        <div class="section-title" id="tituloResultado">Itens para Checagem</div>
        <div id="infoVeiculoPdf" class="info-pdf-only"></div>
        <div id="listaManutencao"></div>
    </div>

    <button id="btnExportarPdf" class="btn-pdf no-print" style="display: none;">📄 Baixar Relatório em PDF</button>
</div>

<script src="script.js"></script>
</body>
</html>
